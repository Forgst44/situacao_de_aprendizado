
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Administrador</title>

    <link rel="stylesheet" href="resources/script/css/loginAdmin.css">

    <script src="resources/script/loginAdmin.js" defer></script>
</head>

<body>

    <main class="container">

        <h2>Área do Administrador</h2>

        <form id="formLoginAdmin" novalidate>

            <label for="email">E-mail do administrador:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail">

            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" placeholder="Digite sua senha">

            <button type="submit">Entrar como Administrador</button>

            <p>
                <a href="index.html">Voltar para o início</a>
            </p>

        </form>

    </main>

</body>
</html>
