
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eventos da comunidade</title>

    <link rel="stylesheet" href="resources/css/style.css">

    <script type="module" src="resources/script/eventos.js"></script>
</head>

<body>

    <h1>Eventos da comunidade</h1>

    <h3 id="mensagemMorador"></h3>

    <p>Escolha um evento para participar:</p>

    <div id="listaEventos">

        <h2>Campanha de arrecadação</h2>
        <p>Arrecadação de alimentos para famílias necessitadas.</p>
        <button data-evento="1">Participar</button>

        <hr>

        <h2>Mutirão de limpeza</h2>
        <p>Ajude a manter nosso bairro limpo e organizado.</p>
        <button data-evento="2">Participar</button>

        <hr>

        <h2>Reunião de moradores</h2>
        <p>Participe das decisões e melhorias da comunidade.</p>
        <button data-evento="3">Participar</button>

    </div>

</body>

</html>
