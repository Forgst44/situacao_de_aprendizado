
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login de Moradores</title>

    <link rel="stylesheet" href="resources/script/css/style.css">
<link rel="stylesheet" href="resources/script/css/login.css">
    <script src="resources/script/acesse.js" defer></script>
</head>

<body>

    <main class="container">

        <form id="formulario" novalidate>

            <h2>Login de moradores</h2>

            <label for="emailLogin">E-mail</label>
            <input
                type="email"
                id="emailLogin"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="senhaLogin">Senha</label>
            <input
                type="password"
                id="senhaLogin"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit" id="btnLogin">
                Entrar
            </button>

            <p class="cadastro">
                Ainda não possui cadastro?
                <a href="cadastrar.html">Cadastre-se</a>
            </p>

            <p class="voltar">
                <a href="index.html">Voltar para o início</a>
            </p>

        </form>

    </main>

</body>

</html>
