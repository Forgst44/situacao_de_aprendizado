
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Moradores</title>

    <link rel="stylesheet" href="resources/script/css/style.css">

    <script src="resources/script/moradores.js" defer></script>
    <script src="resources/script/validar.js" defer></script>
    <script src="resources/script/cadastrar.js" defer></script>
    <link rel="stylesheet" href="resources/script/css/cadastro.css">
</head>

<body>

    <main class="acess">

        <form id="formCadastro" novalidate>

            <h1>Cadastro de moradores</h1>

            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome">

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail">

            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Digite sua senha">

            <label for="address">Endereço</label>
            <input type="text" id="address" placeholder="Digite seu endereço">

            <label for="celular">Celular</label>
            <input type="tel" id="celular" placeholder="Digite seu celular">

            <button type="submit" id="btnCadastrar">
                Cadastrar
            </button>

            <p>
                Já possui cadastro?
                <a href="login.html">Faça login</a>
            </p>

            <p>
                <a href="index.html">Voltar para o início</a>
            </p>

        </form>

    </main>

</body>

</html>
