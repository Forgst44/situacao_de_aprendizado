<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de moradores</title>

    <link rel="stylesheet" href="resources/css/style.css">

    <script type="module" src="resources/script/script.js"></script>
</head>

<body>

    <h1>Cadastro de moradores</h1>

    <input type="text" id="nome" placeholder="Digite seu nome">
    <input type="email" id="email" placeholder="Digite seu email">
    <input type="password" id="password" placeholder="Digite sua senha">
    <input type="text" id="address" placeholder="Digite seu endereço">
    <input type="tel" id="celular" placeholder="Digite seu celular">

    <button id="btnCadastrar">Cadastrar</button>

    <hr>

    <h2>Login de moradores</h2>

    <input type="email" id="emailLogin" placeholder="Digite seu email">
    <input type="password" id="senhaLogin" placeholder="Digite sua senha">

    <button id="btnLogin">Entrar</button>

    <hr>

    <h2>Login do administrador</h2>

    <input type="email" id="emailAdmin" placeholder="Email do administrador">
    <input type="password" id="senhaAdmin" placeholder="Senha do administrador">

    <button id="btnLoginAdmin">Entrar como administrador</button>

</body>

</html>
